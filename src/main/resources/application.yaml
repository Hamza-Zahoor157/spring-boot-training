spring:
  application:
    name: Lecture02
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragdb}
    username: ${DB_USERNAME:123}
    password: ${DB_PASSWORD:123}
  security:
    oauth2:
      client:
        #        provider:
        #          github:
        #            user-name-attribute:login
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL:gemini-flash-latest}
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: 768
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

logging:
  level:
    sql: debug
    web: debug
    liquibase: debug

management:
  endpoints:
    web:
      exposure:
        include: "*"

  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

  # The local receiver accepts traces, but not OTLP metrics at /v1/metrics.
  # Metrics remain available through the configured Prometheus registry.
  otlp:
    metrics:
      export:
        enabled: false

app:
  message:
    welcome: Welcome to RedMath
